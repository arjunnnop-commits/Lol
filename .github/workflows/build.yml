name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find Gradle project folder
        id: find
        shell: bash
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "No project folder in the repo - looking for a project .zip ..."
            while IFS= read -r z; do
              echo "Unpacking $z"
              rm -rf _project && mkdir -p _project
              unzip -q -o "$z" -d _project || continue
              f=$(find _project -name settings.gradle.kts | head -n 1)
              [ -n "$f" ] && break
            done < <(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' -not -path './_project/*')
          fi
          if [ -z "$f" ]; then
            echo "::error::No Gradle project found. Upload GlassFastboot-v3.zip (or the project files) to the repo."
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project folder: $(dirname "$f")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GlassFastboot-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
